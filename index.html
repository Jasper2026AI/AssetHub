<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>AssetHub</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AssetHub">
<meta name="application-name" content="AssetHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不阻塞页面：网络慢 / 打不开 Google 时也能立刻显示（以前会白屏等很久） -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>html,body{background:#000;color:#fff}</style>
<script>
/* 启动保护：页面没能正常显示时，给出原因和「重新加载 / 清除缓存」按钮（不会删除数据） */
(function () {
  var errs = [];
  window.addEventListener('error', function (e) { errs.push((e.message || 'Error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { errs.push('Promise: ' + (e.reason && e.reason.message || e.reason)); });
  function fix() {
    var p = [];
    if ('serviceWorker' in navigator) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(p).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
  }
  window.__bootFix = fix;
  var shown = false;
  function check() {
    if (shown) return;
    var tb = document.getElementById('topbar');
    if (tb && tb.children.length) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000;color:#eee;font:15px/1.6 -apple-system,sans-serif;padding:max(48px,env(safe-area-inset-top)) 22px 22px;overflow:auto';
    var en = !/^zh/i.test(navigator.language || '');
    d.innerHTML = '<h2 style="margin:0 0 10px;font-size:20px">' + (en ? 'AssetHub did not load' : 'AssetHub 没能正常打开') + '</h2>'
      + '<p style="margin:0 0 16px;color:#aaa">' + (en ? 'Your data is safe on this device. Try reloading; if it still fails, clear the cached app files (your data is kept).' : '你的数据还在这台设备上，不会丢。先点「重新加载」；还不行就点「清除缓存后重新加载」（只清除缓存的程序文件，不会删除数据）。') + '</p>'
      + '<button id="bf-r" style="display:block;width:100%;margin:0 0 10px;padding:13px;border:0;border-radius:12px;background:#ff9000;color:#000;font-size:16px;font-weight:600">' + (en ? 'Reload' : '重新加载') + '</button>'
      + '<button id="bf-c" style="display:block;width:100%;margin:0 0 18px;padding:13px;border:1px solid #444;border-radius:12px;background:#1c1c1e;color:#fff;font-size:16px">' + (en ? 'Clear cache and reload' : '清除缓存后重新加载') + '</button>'
      + '<pre style="white-space:pre-wrap;word-break:break-all;color:#ff6b6b;font-size:12px;margin:0">' + (errs.join('\n') || (en ? 'No error recorded (still loading or network is slow).' : '没有记录到错误（可能还在加载或网络很慢）。')).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) + '</pre>';
    shown = true;
    document.body.appendChild(d);
    document.getElementById('bf-r').onclick = function () { location.reload(); };
    document.getElementById('bf-c').onclick = fix;
  }
  window.addEventListener('load', function () { setTimeout(check, errs.length ? 300 : 2500); });
  setTimeout(check, 12000);
})();
</script>
<link rel="stylesheet" href="assets/css/style.css?v=9.4">
</head>
<body>
  <!-- 背景光晕 -->
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- 顶部栏：图标 / 主标题 / 副标题 / 中英切换 / 币种 / 刷新行情 / 记一笔 -->
  <header class="topbar" id="topbar"></header>

  <main class="wrap">
    <!-- 页面目录（横向靠左） + 布局切换 -->
    <div class="navrow" id="navrow"></div>
    <!-- 固定的四个指标卡 -->
    <section class="kpis" id="kpis"></section>
    <!-- 当前页面内容 -->
    <section id="page"></section>
    <footer class="foot" id="foot"></footer>
  </main>

  <!-- 手机端底部标签栏 -->
  <nav class="tabbar" id="tabbar"></nav>

  <div id="modal-root"></div>
  <div id="dialog-root"></div>
  <div id="toast-root"></div>
  <input type="file" id="file-import" accept=".json,application/json" hidden>
  <input type="file" id="file-icon" accept="image/*" hidden>

  <script src="assets/js/i18n.js?v=9.4"></script>
  <script src="assets/js/charts.js?v=9.4"></script>
  <script src="assets/js/api.js?v=9.4"></script>
  <script src="assets/js/pako.min.js?v=9.4"></script>
<script src="assets/js/app.js?v=9.4"></script>
</body>
</html>
